<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="axSquiggle: sketch it, it cleans itself up">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4e8"/>
      <stop offset="1" stop-color="#ffd9bd"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" rx="28" fill="url(#bg)"/>
  <!-- wordmark -->
  <text x="70" y="140" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="104" font-weight="800" fill="#2b2118">ax<tspan fill="#e8590c">Squiggle</tspan></text>
  <!-- hand-drawn underline -->
  <path d="M72 182 C150 160 210 204 290 180 S430 162 510 184 S650 202 700 172" fill="none" stroke="#e8590c" stroke-width="9" stroke-linecap="round"/>
  <text x="72" y="240" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" fill="#5b4636">Sketch it. It cleans itself up. Hand it to your AI.</text>
