    <path d="M6 30 C40 22 120 34 150 26 C158 62 152 120 148 150 C110 158 50 146 8 156 C14 110 2 70 6 30Z" fill="none" stroke="#e8590c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 14" opacity=".55"/>
    <path d="M200 60 L226 76 L200 92" fill="none" stroke="#e8590c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M168 76 L216 76" fill="none" stroke="#e8590c" stroke-width="8" stroke-linecap="round"/>
    <rect x="250" y="26" width="140" height="130" rx="14" fill="#fff" stroke="#2b2118" stroke-width="6"/>
    <rect x="268" y="46" width="104" height="14" rx="7" fill="#2b2118"/>
    <rect x="268" y="76" width="104" height="12" rx="6" fill="#d8cfc4"/>
    <rect x="268" y="98" width="70" height="12" rx="6" fill="#d8cfc4"/>
    <rect x="268" y="124" width="64" height="20" rx="10" fill="#e8590c"/>
