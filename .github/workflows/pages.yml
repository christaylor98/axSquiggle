name: Pages
# The site lives at squiggle.axstack.dev (repo axSquiggle-site). GitHub Pages only redirects there.
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Redirect to squiggle.axstack.dev
        run: |
          mkdir -p _redirect
          page='<!doctype html><meta charset="utf-8"><title>axSquiggle</title><link rel="canonical" href="https://squiggle.axstack.dev/"><meta http-equiv="refresh" content="0; url=https://squiggle.axstack.dev/"><script>location.replace("https://squiggle.axstack.dev/"+location.pathname.replace(/^\/axSquiggle\/?/,"").replace(/\.html$/,"")+location.hash)</script><a href="https://squiggle.axstack.dev/">squiggle.axstack.dev</a>'
          for f in index.html 404.html app.html how-to.html; do printf '%s\n' "$page" > "_redirect/$f"; done
      - uses: actions/upload-pages-artifact@v3
        with: { path: _redirect }
      - id: deploy
        uses: actions/deploy-pages@v4
